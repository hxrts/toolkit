[package]
name = "toolkit-style-limits"
version = "0.2.0"
edition = "2021"
description = "Portable dylint checks for source size limits"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting = { git = "https://github.com/trailofbits/dylint.git", rev = "a63e31eac4f4db8cea6d1d960c6cdb8e1e52457a", package = "dylint_linting" }

[features]
rlib = ["dylint_linting/constituent"]

[package.metadata.rust-analyzer]
rustc_private = true
